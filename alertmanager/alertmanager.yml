route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram'

receivers:
  - name: telegram
    telegram_configs:
      - send_resolved: true
        api_url: https://api.telegram.org
        bot_token:
        chat_id:
        message: '{{ template "telegram.default.message" . }}'
        parse_mode: HTML

templates:
  - '/etc/alertmanager/templates/telegram.tmpl'

inhibit_rules:
  - source_match: {alertname: 'TargetDown'}
    target_match: {scope: 'container'}
    equal: ['instance']
  - source_match: {severity: 'critical'}
    target_match: {severity: 'warning'}
    equal: ['alertname', 'mountpoint']
  - source_match: {severity: 'critical'}
    target_match: {severity: 'warning'}
    equal: ['alertname', 'instance']